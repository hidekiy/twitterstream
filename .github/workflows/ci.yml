name: Node.js CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
